[project]
name = "poeclifilter"
version = "0.1.0"
description = "A Path of Exile loot filter generating file locally with changes made via CLI, supporting both PoE 1 and PoE 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
poeclifilter = "poeclifilter.cli:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tst"]
addopts = "--import-mode=importlib"
pythonpath = ["tst"]

[tool.coverage.run]
source = ["poeclifilter"]
branch = true

[tool.coverage.report]
show_missing = true
